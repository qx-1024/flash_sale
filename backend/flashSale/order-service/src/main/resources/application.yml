server:
  port: 8070

spring:
  application:
    name: order-service
  # MySQL
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/flash-sale?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC
    username: root
    password: mysql
  # Nacos
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
  # Redis
  data:
    redis:
      host: 192.168.19.128
      port: 6379
      password: 123456
      database: 0
  # RabbitMQ
  rabbitmq:
    host: 192.168.19.128
    port: 5672
    virtual-host: /
    username: qiu
    password: 123456
    listener:
      # 开启消息持久化
      direct:
        acknowledge-mode: manual
      simple:
        # 并发消费者数量配置
        concurrency: 4  # 最小消费者数量
        max-concurrency: 8  # 最大消费者数量
        prefetch: 1  # 每个消费者每次只处理一条消息
        # 消息确认机制
        acknowledge-mode: manual
        # 重试策略配置
        retry:
          enabled: true  # 开启重试
          initial-interval: 500ms  # 第一次重试的间隔时间，改为500ms更适合秒杀场景
          max-attempts: 3  # 最大重试次数
          multiplier: 2  # 下一次重试间隔的倍数
          max-interval: 3000ms  # 最大重试间隔，缩短到3秒，避免用户等待时间过长
          # 重试机制为有状态的，使用原来的消费者进行重试
          stateless: false
    # 生产者确认机制
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl