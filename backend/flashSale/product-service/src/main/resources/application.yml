server:
  port: 8040

spring:
  application:
    name: product-service
    # MySQL
  # MySQL
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/flash-sale?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC
    username: root
    password: mysql
  # Nacos
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
  # redis
  data:
    redis:
      host: 192.168.19.128
      port: 6379
      password: 123456
      database: 0
  # RabbitMQ
  rabbitmq:
    host: 192.168.19.128
    port: 5672
    virtual-host: /
    username: qiu
    password: 123456
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 500ms
          max-attempts: 5
          max-interval: 5000ms
          multiplier: 1.5
          stateless: true
        prefetch: 1
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      reply-timeout: 2000ms
    cache:
      channel:
        size: 25
      connection:
        mode: connection
        size: 5
    requested-heartbeat: 5s
    connection-timeout: 2000ms

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  level:
    org.qiu: debug